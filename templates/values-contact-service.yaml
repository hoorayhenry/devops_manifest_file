# Default values for techdemand contact-service.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
fullnameOverride: contact-service
namespace: prod
image: 594474085976.dkr.ecr.us-east-2.amazonaws.com/prod/techdemand:contact-service-1ae3141
replicaCount: 2
pdb:
  enabled: true
minAvailable: 1
targetPort: 3003
containerPort: 3003
container:
  resources:
    requests:
      cpu: 0.25
      memory: 256Mi
    limits:
      cpu: 0.5
      memory: 512Mi
  ports:
    - containerPort: 3003
      name: tcp
readinessProbe:
  httpGet:
    path: /health
    port: 3003
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 120
  failureThreshold: 3
livenessProbe:
  httpGet:
    path: /health
    port: 3003
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 120
  failureThreshold: 3
imagePullSecrets: aws-image-pull-secret
hpa:
  maxReplicas: 10
  minReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
enVaribles:
  configMapRef:
    - name: techdemand-env-config
# nodeSelector:
#   topology.hostpath.csi/node: <node-id>
env:
  TZ: "Africa/Lagos"
  NODE_ENV: "production"
  PORT: "3003"

serviceAccount:
  create: false
  automount: false
  name: ""

autoscaling:
  enabled: false

service:
  type: ClusterIP
