# Default values for techdemand.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

fullnameOverride: ""
namespace: ""
image: nginx:latest
replicaCount: 1
containerPort: 80
targetPort: 80

imagePullSecrets: ""

serviceAccount:
  create: false
  automount: false
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP

autoscaling:
  enabled: false

pdb:
  enabled: false

minAvailable: 1

container:
  resources:
    requests:
      cpu: 0.25
      memory: 256Mi
    limits:
      cpu: 0.5
      memory: 512Mi
  ports:
    - containerPort: 80
      name: tcp

readinessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 120
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 120
  failureThreshold: 3

env: {}

enVaribles: {}

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
